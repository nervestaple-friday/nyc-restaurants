Domino Park (May 15, 2026)","added":"2026-05-20","note":"Seafood-and-raw-bar cocktail spot that opened May 15, 2026 next to Cafe Susanne on the Williamsburg waterfront. Chef Jackie Carnesi (ex-Kellogg's Diner, Nura) leading the kitchen with North Fork ingredients — shrimp cocktail, scallop crudo, crab salad, grilled squid, fluke Milanese, roasted chicken. Coastal-inspired cocktail program from Milos Zica. Designed by JBA-nominee Matthew Maddy. Open 5–11pm daily."},  {"name":"Six Coasts by Smorgasburg","address":"Soissons Landing, Governors Island, NY 10004","place_id":null,"lat":40.6905,"lng":-74.0163,"neighborhood":"Governors Island","cuisine":"Pan-American Seafood","hours":null,"source":"Average Socialite / I Love NY / Time Out — Six Coasts grand opening (May 9, 2026)","added":"2026-05-20","note":"Smorgasburg's first full-scale restaurant — 32,000-sqft waterfront venue that opened May 9, 2026 on Soissons Landing in the former Island Oyster space. Pan-American seafood from Chef Scotley Innis (Jamaican-American) spanning Nova Scotia, Gulf Coast, Baja, Bahia. Tropical cocktails, sunset DJ series, visiting-chef residencies, harbor views."},  {"name":"Gusi","address":"432 6th Ave, New York, NY 10011","place_id":null,"lat":40.7346,"lng":-73.999,"neighborhood":"Greenwich Village","cuisine":"Eastern European","hours":null,"source":"Infatuation / Resy / What Now NY — Gusi opens (May 8, 2026)","added":"2026-05-20","note":"Modern Eastern European two-story restaurant that opened May 8, 2026 across from Jefferson Market Library. From husband-wife team Boris Artemyev and Elena Melnikova. Puff-pastry pierogi; pelmeni with beef/pork, veal, elk, buffalo, goose, or tahini-finished Mediterranean version; five weekly-rotating borscht. Elegant ground-floor bar plus intimate upstairs dining room."},  {"name":"Lalaon","address":"22 N 6th St, Brooklyn, NY 11249","place_id":null,"lat":40.7211,"lng":-73.965,"neighborhood":"Williamsburg","cuisine":"Korean BBQ","hours":null,"source":"Infatuation / Time Out / The Most Anticipated Restaurants Opening in Brooklyn May 2026","added":"2026-05-29","note":"Two-story Korean BBQ on the Williamsburg waterfront from Ju Young Oh and Min Sung Kang of studiOH Hospitality (Atti, Kuun, Ms. OHHO). Largest Korean BBQ in Brooklyn — house-aged meats, traditional Korean dishes, makgeolli and soju program, large outdoor patio with East River views toward Smorgasburg."},  {"name":"Birdee Botequim","address":"316 Kent Ave, Brooklyn, NY 11249","place_id":null,"lat":40.7176,"lng":-73.9651,"neighborhood":"Williamsburg","cuisine":"Brazilian / Wine Bar","hours":"Thu-Sat 17:00-21:00","source":"Greenpointers / The Infatuation May 2026","added":"2026-05-29","note":"Evening counterpart to chef Renata Ameni's daytime Brazilian bakery Birdee, opened May 23. Shareable São Paulo-inspired small bites, cocktails like the Pessegro (Aperol, Japanese plum) and Tropicale (sherry, pineapple, green tea), wine program from Kent Hospitality's Kristen Goceljak. Open Thu–Sat 5–9pm. Ameni was a 2026 James Beard semifinalist for Outstanding Pastry Chef."},  {"name":"Last Crumb","address":"144 N 8th St, Brooklyn, NY 11249","place_id":null,"lat":40.7202,"lng":-73.959,"neighborhood":"Williamsburg","cuisine":"Bakery / Cookies","hours":"Mon-Sun 11:00-22:00","source":"Time Out / BusinessWire May 2026","added":"2026-05-29","note":"First brick-and-mortar from viral LA-born DTC cookie brand Last Crumb (founded 2020 by Derek Jaeger), opened May 28 between Bedford and Berry. Single cookies $8.50, 3-count box $24, 6-count $45. Coffee from Parlor plus the brand's own Shaken Milk. Daily 11am–10pm; first 100 visitors Thu–Sat get a free cookie."},  {"name":"Soft Hours","address":"119 Hester St, New York, NY 10002","place_id":null,"lat":40.7164,"lng":-73.9909,"neighborhood":"Lower East Side","cuisine":"Tea House / Cafe","hours":null,"source":"The Infatuation May 2026","added":"2026-05-29","note":"Song Dynasty-inspired tea house from artist Juno Shen — a deliberately quiet sanctuary built around seasonal tea service, small confections, incense, floral arrangements, and rotating art. Philosophy rooted in the Song-era ritual of pausing with tea, flowers, and art as part of daily life."},  {"name":"Love Thy Neighbor","address":"55 Christopher St, New York, NY 10014","place_id":null,"lat":40.7333,"lng":-74.0019,"neighborhood":"West Village","cuisine":"Japanese / Cocktail Bar","hours":null,"source":"Time Out / The Infatuation / Spirits Business May 2026","added":"2026-05-29","note":"All-day Japanese-inspired bar from Shigefumi Kabashima (ROKC, NR) and chef Elias Popa (Oti) in the basement that was legendary jazz club 55 Bar until 2022. Food from Takanori Akiyama (ex-Tsukimi) — Japanese tapas, sandos, share plates. Signature cocktails: Tokyo Banana (banana-infused whisky, vermouth, milk-brew coffee, shio koji) and a wasabi-infused G&T. A queer-celebratory space — a brick from the Stonewall Inn and a Marsha P. Johnson quote set into the floor."},  {"name":"Allegretto al Forno","address":"132 Broadway, Brooklyn, NY 11211","place_id":null,"lat":40.7099,"lng":-73.9657,"neighborhood":"Williamsburg","cuisine":"Italian / Wood-Fired Pizza","hours":null,"source":"Eat Up NY / Infatuation / Greenpointers May 2026","added":"2026-05-30","note":"Casual wood-fired pizza & Southern Italian small-plates spinoff of Michelin-starred Francie next door, opened May 2026. From chef Chris Cipollone and GM John Winterman. Signature duck-sausage pizza with apricot and pistachio pesto; sfizi-driven menu built around the wood oven."},  {"name":"Prince Street Pizza","address":"271 Smith St, Brooklyn, NY 11231","place_id":null,"lat":40.6819,"lng":-73.9933,"neighborhood":"Carroll Gardens","cuisine":"Pizza","hours":null,"source":"Brooklyn Bridge Parents April 2026","added":"2026-05-30","note":"Brooklyn debut of the Nolita pepperoni-square institution, opened on Smith St in spring 2026. Cult-favorite spicy square slices and easy grab-and-go counter service in Carroll Gardens."},  {"name":"Pizza Studio Tamaki","address":"123 St Marks Pl, New York, NY 10009","place_id":null,"lat":40.7281,"lng":-73.9844,"neighborhood":"East Village","cuisine":"Pizza / Tokyo-Neapolitan","hours":null,"source":"Eat Up NY / Infatuation / Hoodline May 2026","added":"2026-05-30","note":"First US outpost of Tokyo pizzaiolo Tsubasa Tamaki's celebrated PST, opened May 5, 2026 in the former Moody Tongue space. Tokyo-Neapolitan style with a proprietary Japanese flour blend, deep-char crust, and 30-hour fermented dough. Bismarck with egg ($36), Bianca with white truffle oil."},  {"name":"Le Sixth","address":"359 6th Ave, New York, NY 10014","place_id":null,"lat":40.7317,"lng":-74.0017,"neighborhood":"West Village","cuisine":"French / Bistro","hours":null,"source":"Infatuation May 2026","added":"2026-05-30","note":"Day-to-night West Village French bistro from a French chef with Hong Kong fine-dining pedigree, opened May 2026. Sole Grenobloise and steak frites at dinner; French omelets, benedicts, and chicken paillard on the weekend brunch menu."},  {"name":"Somssi","address":"79 MacDougal St, New York, NY 10012","place_id":null,"lat":40.7286,"lng":-74.003,"neighborhood":"Greenwich Village","cuisine":"Korean-American / Bistro","hours":null,"source":"WWD / Resy / Culinary Agents / WhatNow June 2026","added":"2026-06-03","note":"Debut concept from Ahris Kim of NA:EUN Hospitality — the team behind Atoboy, Atomix and Naro. A personality-driven 50-seat bistro serving American-by-way-of-Korea fare with shareable plates drawing on Asian and European ingredients, techniques and immigrant nostalgia. Backed by Ellia and Junghyun 'JP' Park; opened early June 2026 in the South Village with a full bar."},  {"name":"Edoya Sushi","address":"151 Rivington St, New York, NY 10002","place_id":null,"lat":40.7196,"lng":-73.9847,"neighborhood":"Lower East Side","cuisine":"Japanese / Omakase","hours":null,"source":"Resy / Yelp / Itsadate NYC May 2026","added":"2026-06-03","note":"Family-run Edomae-style omakase counter from Chef Edgar and his son in the former Sushi Lin space. Seasonal sushi built around traditional Japanese technique with both omakase counter and table seatings; soft-opened spring 2026 and recently added to Resy."},  {"name":"BKB Brooklyn Brasserie","address":"327 Stuyvesant Ave, Brooklyn, NY 11221","place_id":null,"lat":40.6864,"lng":-73.9353,"neighborhood":"Bed-Stuy","cuisine":"Belgian / French","hours":null,"source":"Brownstoner / BKB site / Brooklyn Paper June 2026","added":"2026-06-03","note":"Family-friendly Belgian brasserie on the corner of Stuyvesant and Macon, taking over the former Mama Fox space. Moules frites, steak frites, waffles, bitterballen and beef bourguignon plus ~10 mostly Belgian beer lines, French wines and multiple TVs for soccer matches. Soft-opened in late May 2026 with a full debut targeted for June 20."},  {"name":"Variety Coffee Roasters","address":"190 Franklin St, Brooklyn, NY 11222","place_id":null,"lat":40.7314,"lng":-73.958,"neighborhood":"Greenpoint","cuisine":"Coffee / Bakery","hours":null,"source":"Greenpointers May 22 2026 / WhatNow / Coffee Klatsch June 2026","added":"2026-06-06","note":"Brooklyn-based Variety Coffee Roasters opened its 10th cafe — and largest, most design-forward to date — on June 1, 2026 at The Astral building in Greenpoint, taking over a former laundromat between Java and India Streets. Drip and espresso from their Bushwick roastery alongside pastries from Colson Patisserie, Ole & Steen, and The Good Batch."},  {"name":"Phil's Place","address":"524 Graham Ave, Brooklyn, NY 11222","place_id":null,"lat":40.7196,"lng":-73.9434,"neighborhood":"Greenpoint","cuisine":"Bar / Sandwiches","hours":null,"source":"Greenpointers Apr 7 2026 / Infatuation 2026","added":"2026-06-06","note":"Reincarnation of beloved Graham Ave dive Jimbo Slims after a ownership change and revamp. Mainstay Jimbo's bartender Phil Shepherd partnered with Pomp and Circumstance chef James Ahearn for a renovated room and a new bar-snacks menu (chicken meatball Caesar heros) — drinks stayed in the friendly $9 shot-and-beer, $12-15 cocktails range."},  {"name":"Athena Keke's","address":"222 Greene Ave, Brooklyn, NY 11238","place_id":null,"lat":40.6878,"lng":-73.9621,"neighborhood":"Clinton Hill","cuisine":"Sports Bar / American","hours":null,"source":"GO Magazine / BKReader / Timeout / Yelp 2026","added":"2026-06-06","note":"Brooklyn's first dedicated queer women's sports bar from couple Claudia Capriles and Alexandra Murray, who graduated from years of pop-ups into a brick-and-mortar at 222 Greene Ave in Clinton Hill. Lots of screens for women's sports, a full kitchen drawing on Murray's Baltimore roots and Capriles's Bolivian upbringing, and a library corner of queer-history and women's-sports books."},  {"name":"Olmo","address":"103 Saratoga Ave, Brooklyn, NY 11233","place_id":null,"lat":40.6831,"lng":-73.9171,"neighborhood":"Bed-Stuy","cuisine":"Mexican / Cantina","hours":"Wed-Sun 17:00-23:00","source":"Brooklyn Eagle / Brownstoner / The Infatuation / Hoodline 2026","added":"2026-06-08","note":"Mexico City-style 'cantina Neoyorquina' from Cosme and Pujol alums, with chef Jael Lopez. 850 sq ft corner spot at Saratoga & Decatur featuring a starry-night mural by Alannah Farrell with jacaranda and elm trees. Cheesy queso fundido, chicharron preparado, agave cocktails, beer-based micheladas. Wed-Sun 5-11pm, plates $10-25, drinks ~$15."},  {"name":"Selune","address":"478 Halsey St, Brooklyn, NY 11233","place_id":null,"lat":40.6837,"lng":-73.9361,"neighborhood":"Bed-Stuy","cuisine":"Oyster Bar / Natural Wine","hours":"Mon-Thu 17:00-0:00, Fri-Sat 17:00-1:00","source":"Brooklyn Paper / Time Out / Cititour / Patch June 2026","added":"2026-06-08","note":"Oyster and natural wine bar from Marc Lioussanne (ex-Eden Rock St. Barths, owner of Bistro Général & Mabel in Paris) and partner Bilen Gaga. Opened in a 100-year-old landmark building at Halsey & Lewis with exposed brick, a hand-stained walnut bar salvaged from prior tenants, sage chairs and traditional Ethiopian art. 120+ natural wines (heavy France), oysters, light seafood, charcuterie. Mon-Sat 5pm-midnight (1am Fri-Sat)."},  {"name":"Tsuki","address":"193 Seventh Ave, New York, NY 10011","place_id":null,"lat":40.744,"lng":-73.9986,"neighborhood":"Chelsea","cuisine":"Japanese / Tasting Menu","hours":null,"source":"Eater NY / The Infatuation June 2026","added":"2026-06-08","note":"Neo-Japanese tasting room that opened June 3, 2026 on 7th Ave between 21st and 22nd Streets. Six-course menu structured around the phases of the moon — quietly themed, seasonally driven and a step away from straight omakase."},  {"name":"Conall's Public House","address":"51 First Ave, New York, NY 10003","place_id":null,"lat":40.7251,"lng":-73.9883,"neighborhood":"East Village","cuisine":"Irish Pub / Sports Bar","hours":null,"source":"Eater NY / europesays.com June 2026","added":"2026-06-08","note":"Irish cocktail sports pub that opened May 14, 2026 on First Ave between 3rd and 4th Streets. Curry chips, bangers and mash, and a full Guinness program in a room built for watching sports — leaning into the East Village's growing Irish-pub revival."},  {"name":"Paulie Gee's Slice Shop (East Village)","address":"100 First Ave, New York, NY 10009","place_id":null,"lat":40.7274,"lng":-73.987,"neighborhood":"East Village","cuisine":"Pizza / Slice Shop","hours":null,"source":"Eater NY / europesays.com May 2026","added":"2026-06-08","note":"Second slice shop from Paulie Gee's, run by longtime employee Justin Vermillion. Opened May 28, 2026 at First Ave & 6th St. Square Detroit-leaning slices, the signature Hellboy with hot honey, and the same vegan-pepperoni offerings that made the Greenpoint original a destination."},  {"name":"Tacos Domingo","address":"131 First Avenue, New York, NY 10003","place_id":"tacos-domingo-nyc-2026","lat":40.7271,"lng":-73.9845,"neighborhood":"East Village","cuisine":"Mexican / Tacos","hours":null,"source":"https://ny.eater.com/news/411872/nyc-new-restaurant-openings-june-2026","added":"2026-06-17","note":"Mexico City taqueria import from Tacos Domingo, known for carne asada. Opened June 7 at St. Marks Place (former Brooklyn Dumpling Shop). Menu: carne asada tacos, tacos piratas with melted cheese."},  {"name":"Forno D'Oro","address":"196 Eighth Avenue, New York, NY 10011","place_id":"forno-doro-nyc-2026","lat":40.7462,"lng":-74.0003,"neighborhood":"Chelsea","cuisine":"Italian / Pizza","hours":null,"source":"https://ny.eater.com/news/411872/nyc-new-restaurant-openings-june-2026","added":"2026-06-17","note":"Roman-style pizza from chef Salvatore Olivella. Opened June 1. Toppings: nduja, soppressata, hot honey, burrata, arugula, bresaola. At West 20th Street."},  {"name":"Ngon Vietnamese Kitchen","address":"85 Second Avenue, New York, NY 10003","place_id":"ngon-vietnamese-kitchen-nyc-2026","lat":40.7254,"lng":-73.9879,"neighborhood":"East Village","cuisine":"Vietnamese","hours":null,"source":"https://ny.eater.com/news/411872/nyc-new-restaurant-openings-june-2026","added":"2026-06-17","note":"First NYC outpost of acclaimed Dallas restaurant (Michelin Bib Gourmand). Northern Vietnamese cuisine. Opened June 1 at East Fifth Street."},  {"name":"Alma Mexicana Restaurante","address":"242 East Third Street, New York, NY 10009","place_id":"alma-mexicana-nyc-2026","lat":40.7214,"lng":-73.9842,"neighborhood":"East Village","cuisine":"Mexican","hours":null,"source":"https://ny.eater.com/news/411872/nyc-new-restaurant-openings-june-2026","added":"2026-06-17","note":"Affordable taqueria by owner Luis Cano. Opened June 1 in former Rossy's Bakery space. Tacos 2 for $4.99, quesadillas, burritos, pollo guisado, empanadas. Between Avenues B and C."},  {"name":"Wolf Pub Bar","address":"447 Rogers Avenue, Brooklyn, NY 11225","place_id":"wolf-pub-bar-brooklyn-2026","lat":40.6588,"lng":-73.9509,"neighborhood":"Prospect Lefferts Gardens","cuisine":"Bar / Cocktails","hours":null,"source":"https://ny.eater.com/news/411872/nyc-new-restaurant-openings-june-2026","added":"2026-06-17","note":"Neon-lit cocktail bar with 1990s aesthetic. Opened June 5. Cassette tapes, group shot-skis, bright blue drinks in fish-shaped glassware. Near Bedford Avenue."},  {"name":"Cafe Bar J.F.","address":"50 Withers Street, Brooklyn, NY 11211","place_id":"cafe-bar-jf-williamsburg-2026","lat":40.7188,"lng":-73.9453,"neighborhood":"Williamsburg","cuisine":"South American / Tavern","hours":null,"source":"https://ny.eater.com/restaurant-openings/411355/cafe-bar-j-f-williamsburg-opening-llama-inn-erik-ramirez-juan-correa","added":"2026-06-18","note":"South American-leaning tavern from Llama Inn restaurateur Juan Correa and chef Francisco Castillo (initials = J+F). Opened May 13, 2026 in the former Llama Inn space at Withers & Meeker. Menu spans Peru, Chile, Argentina: grilled swordfish with yellow-eyed beans, lobster arroz meloso, pisco sour from Correa family recipe. Wines from Valle de Uco, Pisco Valley, Valle de Itata. Design by Madrid studio Plantea Estudio."},  {"name":"Balera","address":"442 Graham Avenue, Brooklyn, NY 11211","place_id":"balera-williamsburg-2026","lat":40.7152,"lng":-73.9437,"neighborhood":"Williamsburg","cuisine":"Italian / Pizza","hours":null,"source":"https://ny.eater.com/maps/best-new-restaurants-brooklyn-heatmap / Eater NY April 2026","added":"2026-06-18","note":"Two-floor Williamsburg pizzeria with a disco ball and menu rooted in Piedmont and Emilia-Romagna. Opened April 2026. Thin-crust Roman-style pizza, pastas, and a seafood salad with octopus, shrimp, and potatoes. Live music or DJs on Friday and Saturday evenings. Named after Italian dance halls (balera)."},  {"name":"Eleanor's Jour Et Nuit","address":"398 Ninth Avenue, New York, NY 10001","place_id":"eleanors-jour-et-nuit-nyc-2026","lat":40.7513,"lng":-73.9997,"neighborhood":"Chelsea","cuisine":"French-inspired / Bar / Cafe","hours":null,"source":"https://ny.eater.com/news/411872/nyc-new-restaurant-openings-june-2026","added":"2026-06-18","note":"Hot new spot from Greek hospitality group Avra; name means \"day and night.\" Sibling of piano bar Le Bar Penelope. Opened June 9, 2026 at W 33rd Street. Daytime cafe setup morphs into cocktails, dinner, and DJs at night. Avra is known for energetic, buzzy venues."},  {"name":"Cocotazo","address":"349 E 109th Street, New York, NY 10029","place_id":"cocotazo-east-harlem-2026","lat":40.794,"lng":-73.94,"neighborhood":"East Harlem","cuisine":"Puerto Rican","hours":null,"source":"https://ny.eater.com/news/411872/nyc-new-restaurant-openings-june-2026","added":"2026-06-18","note":"Chef Frances Roman’s Puerto Rican pop-up (formerly at Queens Night Market and La Marqueta) found its permanent home in El Barrio in June 2026. Slow-roasted pernil, house-made condensed milk ice cream, bread pudding, fried cod fish fritters, guava barbecue ribs, other family recipes. At First Avenue near E 109th Street."},  {"name":"Capitaine","address":"684 Greenwich St, New York, NY 10014","place_id":null,"lat":40.7329531,"lng":-74.0076386,"neighborhood":"West Village","cuisine":"Seafood","hours":null,"source":"Eater NY / Infatuation / Andrea Strong / What Now NY June 2026","added":"2026-06-29","note":"European-inspired seafood tavern from Cody Pruitt and Jacob Cohen (Libertine, Chateau Royale), chef Mike Gutterman, in the former Libertine space at Greenwich & Christopher. Opened June 19, 2026. Raw bar (East Coast oysters, razor clams, shrimp cocktail, Jonah crab claws), lobster roll, steak frites, Wagyu burger, and a throwback caviar sandwich on Japanese milk bread with sauce gribiche. Freezer-cold martinis; sapele wood paneling. Evenings + weekend brunch to start.","status":"opened"},  {"name":"Titán","address":"5 Front St, Brooklyn, NY 11201","place_id":null,"lat":40.702697,"lng":-73.992298,"neighborhood":"DUMBO","cuisine":"Mexican","hours":"Wed-Sun 17:00-22:00","source":"Andrea Strong Substack / Infatuation June 2026","added":"2026-06-29","note":"Fine Mexican from Alan Delgado (Los Burritos Juarez) and Ivy Mix (Leyenda, Whoopsie Daisy). Opened June 17, 2026 in DUMBO. Carne asada tacos, cod in masa tempura, aguachiles; bar leans into regional Mexican spirits like charanda and Oaxacan aguardientes with seasonal ingredients. Wed-Sun 5-10pm.","status":"opened"},  {"name":"Unnecessary","address":"66 Delancey St, New York, NY 10002","place_id":null,"lat":40.7195035,"lng":-73.9905455,"neighborhood":"Lower East Side","cuisine":"Ice Cream / Dessert","hours":null,"source":"Infatuation / Eater NY June 2026","added":"2026-06-29","note":"Cocktail-inspired soft-serve shop from the Double Chicken Please team, which reimagines cocktails and beverages as ice cream, including alcoholic flavors. Opened June 2026 on the Lower East Side.","status":"opened"},  {"name":"Eldridge Street Store","address":"111 Eldridge St, New York, NY 10002","place_id":null,"lat":40.7182653,"lng":-73.9921455,"neighborhood":"Lower East Side","cuisine":"Chinese","hours":"Thu-Sat until 4:00","source":"Infatuation June 2026","added":"2026-06-29","note":"Late-night Chinese spot on the Lower East Side serving classics like peanut butter noodles and fried chicken wings. Open until 4am Thursday-Saturday. Opened June 2026.","status":"opened"},  {"name":"Noury","address":"137 Sullivan St, New York, NY 10012","place_id":null,"lat":40.7267968,"lng":-74.0017843,"neighborhood":"Soho","cuisine":"Japanese / Izakaya","hours":null,"source":"Resy / Infatuation June 2026","added":"2026-06-29","note":"Modern izakaya from the Kiko team (the Hudson Square restaurant that earned two NYT stars and an Esquire Best New Restaurants nod in 2025). 39-seat room at 137 Sullivan St. Multicultural team fusing local ingredients with premium Japanese ones. Opened June 2026.","status":"opened"},  {"name":"Lala Hot Chicken","address":"249 9th Ave, New York, NY 10001","place_id":null,"lat":40.747915,"lng":-74.000415,"neighborhood":"Chelsea","cuisine":"Korean / Fried Chic // Blacklist: entries with `"blacklisted": true` in restaurants.json are spots
// Jim has visited and doesn't want resurfaced — neither in the map/list/counts
// here, nor as candidates for future scout cycles. We strip them at the very
// top of the pipeline so every downstream stage (dedup, sort, neighborhood
// counts, cuisine filters, NEW-recent badge, markers) operates on the clean
// set. The entries stay in restaurants.json as tombstones so a future scout
// pass looking up the name finds the blacklisted flag and skips re-adding.
const restaurants = rawRestaurants.filter(r => !r.blacklisted);

function addedScore(d) {
  if (!d) return 0;
  if (d.length === 10) return Date.parse(d);
  if (d.length === 7) return Date.parse(d + '-01');
  return 0;
}

// Status now lives on each entry in restaurants.json as a `status` field:
//   "upcoming"   — visible on the map but not fully open yet (soft-opening,
//                  friends-and-family, pre-opening previews). Shows a sky-blue
//                  "Coming Soon" badge so visitors don't show up expecting
//                  regular service. Past-tense "Opened on …" notes do NOT
//                  belong here — those are open, not upcoming.
//   "temporary"  — pop-ups, residencies, limited runs. Orange "Pop-Up" badge.
//   "closed"     — permanently closed. Greyed-out pin, red "Closed" badge.
//                  Entries stay in the data so the map still tells the
//                  neighborhood's story.
// A missing/null status means "open & operating" (the default).

// Opening hours live on each entry in restaurants.json as an `hours` string
// ("Tue-Sat 17:00-22:00", "Mon-Sun until 4:00", \u2026), rendered verbatim on cards
// and in popups. They used to sit in a HOURS object keyed by restaurant name
// right here, which meant a rename or a blacklisting silently orphaned the
// hours (the entry for the since-blacklisted Alma Negra had been dead for
// weeks and nothing surfaced it). A missing/null `hours` renders nothing \u2014
// most entries don't have hours yet.

function cuisineCategory(cuisine) {
  const c = (cuisine || '').toLowerCase();
  // Specific Asian cuisines come first so compound names like
  // "Korean Steakhouse", "Korean-Italian", "Vietnamese-Mexican Fusion",
  // and "French-Vietnamese" don't get swallowed by broader categories below.
  if (c.includes('vietnamese')) return 'Vietnamese';
  if (c.includes('korean')) return 'Korean';
  if (c.includes('mexican')) return 'Mexican';
  if (c.includes('chinese') || c.includes('cantonese') || c.includes('dim sum') || c.includes('shanghainese') || c.includes('dongbei')) return 'Chinese';
  if (c.includes('french') || c.includes('bistro')) return 'French';
  if (c.includes('indian')) return 'Indian';
  if (c.includes('coffee') || c.includes('ice cream') || c.includes('frozen yogurt') || c.includes('acai') || c.includes('smoothie') || c.includes('gelato') || c.includes('dessert')) return 'Coffee & Sweets';
  // American — includes diner-adjacent and rotisserie spots that don't fit a
  // tighter regional bucket. "Jewish deli" lands here because the menu vocab
  // (pastrami, matzo ball, knish) is closer to NY-American comfort than any
  // standalone category would justify at this dataset size.
  if (c.includes('american') || c === 'steakhouse' || c.includes('burgers') || c.includes('southern') || c.includes('sandwich') || c.includes('deli') || c.includes('rotisserie')) return 'American';
  if (c.includes('mediterranean') || c.includes('israeli') || c.includes('persian') || c.includes('greek') || c.includes('falafel')) return 'Mediterranean';
  if (c.includes('seafood') || c.includes('oyster')) return 'Seafood';
  if (c.includes('japanese') || c === 'nikkei' || c.includes('omakase') || c.includes('sushi') || c.includes('izakaya')) return 'Japanese';
  if (c.includes('caribbean') || c.includes('puerto rican') || c.includes('cuban') || c.includes('haitian')) return 'Caribbean';
  if (c.includes('italian')) return 'Italian';
  if (c.includes('thai')) return 'Thai';
  // Latin American (non-Mexican) — Brazilian, Colombian, Peruvian, etc.
  if (c.includes('brazilian') || c.includes('latin') || c.includes('colombian') || c.includes('peruvian') || c.includes('argentinian') || c.includes('venezuelan')) return 'Latin American';
  // Eastern European & Caucasus — Georgian, Ukrainian, Polish, Russian, etc.
  if (c.includes('georgian') || c.includes('eastern european') || c.includes('polish') || c.includes('ukrainian') || c.includes('russian')) return 'Eastern European';
  if (c.includes('tibetan') || c.includes('malaysian') || c.includes('hong kong') || c.includes('taiwanese') || c.includes('filipino') || c.includes('singaporean')) return 'Asian';
  // Dining-mode buckets — surface tasting menus and wild-to-table as their own
  // filters before falling through to bar/cafe defaults.
  if (c.includes('tasting')) return 'Tasting Menu';
  if (c.includes('wild')) return 'Wild-to-Table';
  if (c.includes('speakeasy') || c.includes('cafe') || c.includes('caf\u00e9') || c.includes('bar') || c.includes('wine')) return 'Cafe & Bar';
  if (c.includes('bakery') || c.includes('bagel')) return 'Bakery';
  if (c.includes('pizza')) return 'Pizza';
  return 'Other';
}

const seen = new Set();
const deduped = restaurants.filter(r => {
  const key = r.name + '|' + r.address;
  if (seen.has(key)) return false;
  seen.add(key);
  return true;
});

deduped.sort((a, b) => addedScore(b.added) - addedScore(a.added));
deduped.forEach(r => { r.cuisineCat = cuisineCategory(r.cuisine); });

const STATUS_LABELS = {
  closed: 'Closed',
  upcoming: 'Coming Soon',
  temporary: 'Pop-Up',
};
// The scout writes `coming_soon` into restaurants.json for pre-opening spots;
// the rendering canon is `upcoming` (sky-blue badge + hourglass pin). Alias so
// the data value resolves to the same badge/pin instead of silently rendering
// nothing. `opened` intentionally has no label — it means "open", the default.
const STATUS_ALIASES = { coming_soon: 'upcoming' };
function getStatus(r) {
  let s = r.status;
  if (!s) return null;
  s = STATUS_ALIASES[s] || s;
  const label = STATUS_LABELS[s];
  return label ? { label, cls: s } : null;
}

// Highlight entries added within the last RECENT_WINDOW_MS so visitors can
// spot fresh scout-cycle additions at a glance regardless of which sort or
// filter they have active. Orthogonal to getStatus(): a place can be both
// Pop-Up and NEW, etc.
const RECENT_WINDOW_MS = 7 * 24 * 60 * 60 * 1000;
const NOW_MS = Date.now();
function isRecentlyAdded(r) {
  const t = addedScore(r.added);
  return t > 0 && (NOW_MS - t) <= RECENT_WINDOW_MS;
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function gmapsUrl(r) {
  // Prefer a name+address text query — Google Maps resolves that to the actual
  // listing. Falling back to bare lat/lng (as we used to) drops you on a generic
  // pin with no business name when place_id is missing.
  const parts = [];
  if (r.name) parts.push(r.name);
  if (r.address) parts.push(r.address);
  let query;
  if (parts.length) {
    query = encodeURIComponent(parts.join(', '));
  } else if (r.lat != null && r.lng != null) {
    query = `${r.lat},${r.lng}`;
  } else {
    return '#';
  }
  const base = `https://www.google.com/maps/search/?api=1&query=${query}`;
  return r.place_id ? base + `&query_place_id=${r.place_id}` : base;
}

function formatAdded(d) {
  if (!d) return '';
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const parts = d.split('-');
  const month = months[parseInt(parts[1], 10) - 1];
  if (parts[2]) return 'Added ' + month + ' ' + parseInt(parts[2], 10) + ', ' + parts[0];
  return 'Added ' + month + ' ' + parts[0];
}

// Floating pill that appears after a mobile card-tap. The card activate()
// handler stops scrolling to the map on narrow viewports because that
// pulled the tapped card off-screen; the pill replaces the lost feedback
// with an explicit "↑ <Name> on map" affordance. Click → smooth scroll to
// the top. Auto-dismisses after 5s, or as soon as the user scrolls near
// the top (the map is back in view, the pill is redundant).
const mapLinkPill = document.createElement('button');
mapLinkPill.type = 'button';
mapLinkPill.className = 'map-link-pill';
mapLinkPill.setAttribute('aria-label', 'Scroll to map');
document.body.appendChild(mapLinkPill);
let mapLinkPillTimer = null;
function hideMapLinkPill() {
  mapLinkPill.classList.remove('visible');
  if (mapLinkPillTimer) { clearTimeout(mapLinkPillTimer); mapLinkPillTimer = null; }
}
function showMapLinkPill(label) {
  mapLinkPill.textContent = '↑ ' + label + ' on map';
  mapLinkPill.classList.add('visible');
  if (mapLinkPillTimer) clearTimeout(mapLinkPillTimer);
  mapLinkPillTimer = setTimeout(hideMapLinkPill, 5000);
}
mapLinkPill.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
  hideMapLinkPill();
});
window.addEventListener('scroll', () => {
  if (mapLinkPill.classList.contains('visible') && window.scrollY < 120) {
    hideMapLinkPill();
  }
}, { passive: true });

// Back-to-top button. Appears once the user scrolls past BACK_TO_TOP_THRESHOLD
// (deep enough into the long card list that the map/search are well off-screen)

const BACK_TO_TOP_THRESHOLD = 500;

backToTop.type = 'button';
backToTop.className = 'back-to-top';
backToTop.setAttribute('aria-label', 'Back to top');

backToTop.addEventListener('click', () => {

window.addEventListener('scroll', () => {
  backToTop.classList.toggle('visible', window.scrollY > BACK_TO_TOP_THRESHOLD);

const mappable = deduped.filter(r => r.lat != null && r.lng != null);

// Fan out markers that share a location so overlapping pins stay individually
// clickable. Real coordinates (r.lat / r.lng) are kept untouched for popups
// and Google Maps links; only displayLat / displayLng are nudged.
(function spreadOverlappingMarkers() {
  const COLLISION_RADIUS_M = 40;   // group markers within this radius — wide enough
                                   // to catch same-building neighbors that Google
                                   // geocodes 30+ m apart (e.g. Mariscos El Submarino
                                   // upstairs from Vato at 226 7th Ave).
  const FAN_RADIUS_M = 18;         // distance from cluster center for each pin —
                                   // gives ~36 m of separation, larger than the
                                   // 28-px pin icon at typical city zoom.
  const R = 6371000;
  function metersBetween(a, b) {
    const lat1 = a.lat * Math.PI / 180;
    const lat2 = b.lat * Math.PI / 180;
    const dLat = (b.lat - a.lat) * Math.PI / 180;
    const dLng = (b.lng - a.lng) * Math.PI / 180;
    const x = Math.sin(dLat / 2) ** 2 +
              Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  const assigned = new Set();
  const groups = [];
  for (let i = 0; i < mappable.length; i++) {
    if (assigned.has(i)) continue;
    const group = [i];
    assigned.add(i);
    for (let j = i + 1; j < mappable.length; j++) {
      if (assigned.has(j)) continue;
      if (metersBetween(mappable[i], mappable[j]) <= COLLISION_RADIUS_M) {
        group.push(j);
        assigned.add(j);
      }
    }
    if (group.length > 1) groups.push(group);
  }
  groups.forEach(group => {
    const centerLat = group.reduce((s, i) => s + mappable[i].lat, 0) / group.length;
    const centerLng = group.reduce((s, i) => s + mappable[i].lng, 0) / group.length;
    const mPerDegLat = 111320;
    const mPerDegLng = 111320 * Math.cos(centerLat * Math.PI / 180);
    group.forEach((idx, k) => {
      const angle = (2 * Math.PI * k) / group.length - Math.PI / 2;
      mappable[idx].displayLat = centerLat + (FAN_RADIUS_M * Math.sin(angle)) / mPerDegLat;
      mappable[idx].displayLng = centerLng + (FAN_RADIUS_M * Math.cos(angle)) / mPerDegLng;
    });
  });
  mappable.forEach(r => {
    if (r.displayLat == null) { r.displayLat = r.lat; r.displayLng = r.lng; }
  });
})();

// Compute initial bounds from the inner percentile range of marker coordinates
// so a handful of outliers (e.g. Astoria, Elmhurst, Upper East Side) don't pull
// the default view away from where 90% of the data actually lives
// (Brooklyn + Lower / East Manhattan). Every marker still renders — users can
// pan to outliers — but the opening framing is tight on the dense core.
function percentileBounds(points, pct) {
  if (points.length === 0) return null;
  const lats = points.map(p => p[0]).sort((a, b) => a - b);
  const lngs = points.map(p => p[1]).sort((a, b) => a - b);
  const lo = Math.floor(lats.length * pct);
  const hi = Math.ceil(lats.length * (1 - pct)) - 1;
  return L.latLngBounds(
    [lats[lo], lngs[lo]],
    [lats[Math.max(hi, lo)], lngs[Math.max(hi, lo)]]
  );
}
const allPoints = mappable.map(r => [r.displayLat, r.displayLng]);
const coreBounds = mappable.length >= 20
  ? percentileBounds(allPoints, 0.05)
  : L.latLngBounds(allPoints);
const map = L.map('map', { zoomControl: true }).fitBounds(coreBounds, { padding: [30, 30] });

// Reset-view control. After clicking a card the map flies in to a single pin
// and stays there — there's no built-in way to zoom back out. This control
// refits the map to the *currently filtered* marker bounds (not the initial
// load bounds), closes any open popup, and hides itself when the map is
// already framing the full filtered set. Kept as a Leaflet control so it
// shares the same z-index / placement contract as zoom +/-.
const ResetView = L.Control.extend({
  options: { position: 'topright' },
  onAdd: function() {
    const btn = L.DomUtil.create('button', 'leaflet-control-reset');
    btn.type = 'button';
    btn.setAttribute('aria-label', 'Reset map to show all visible restaurants');
    btn.innerHTML = '<span class="reset-icon" aria-hidden="true">&#x2922;</span><span>Reset view</span>';
    btn.hidden = true;
    L.DomEvent.disableClickPropagation(btn);
    L.DomEvent.on(btn, 'click', () => {
      map.closePopup();
      fitMapToFiltered();
    });
    this._btn = btn;
    return btn;
  },
  setHidden: function(hidden) {
    if (this._btn) this._btn.hidden = hidden;
  }
});
const resetControl = new ResetView();
resetControl.addTo(map);

// Refit the map to the bounds of all currently visible (filtered) markers
// and hide the Reset control. Called by the control's own click handler
// and by any code path that puts the map back into its canonical framed
// state. Falls through silently if there are no filtered markers (e.g. a
// search query that matched nothing) since there's nothing to fit to.
function fitMapToFiltered() {
  if (!currentFilteredBounds || !currentFilteredBounds.isValid()) {
    resetControl.setHidden(true);
    return;
  }
  map.flyToBounds(currentFilteredBounds, { padding: [30, 30], maxZoom: 16, duration: 0.6 });
  resetControl.setHidden(true);
}

// The Reset control is only meaningful after the user has zoomed past the
// natural framed view — currently the single trigger for that is clicking a
// restaurant card (renderList wires resetControl.setHidden(false) into the
// card's activate handler). Every renderList() pass otherwise re-frames the
// map to the filtered bounds, so the canonical post-render state is
// "hidden". Keeping this as a function (instead of inlining setHidden(true))
// preserves a single seam for future logic — e.g. also hiding when the user
// manually pans back to the natural extent.
function updateResetButtonVisibility() {
  resetControl.setHidden(true);
}

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// Status → pin color mapping. Mirrors the badge palette in CSS so the map
// reads the same way as the cards: closed entries fade out, coming-soon
// pins match the sky-blue badge, pop-ups match the deeper orange badge,
// everything else uses the standard accent. Keeping these inline (instead
// of pulling from CSS vars) so the divIcon HTML can be built without a
// getComputedStyle round-trip on every marker.
const PIN_COLORS = {
  default: { bg: '#f0a030', emoji: '&#127860;', opacity: 1 },     // fork & knife
  upcoming: { bg: '#38bdf8', emoji: '&#9203;', opacity: 1 },      // hourglass
  temporary: { bg: '#e68c14', emoji: '&#127860;', opacity: 1 },
  closed: { bg: '#666', emoji: '&#10005;', opacity: 0.7 }         // X
};

function buildPinIcon(statusCls) {
  const c = PIN_COLORS[statusCls] || PIN_COLORS.default;
  return L.divIcon({
    className: '',
    html: `<div style="width:28px;height:28px;background:${c.bg};border:2px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;font-size:14px;opacity:${c.opacity};">${c.emoji}</div>`,
    iconSize: [28, 28],
    iconAnchor: [14, 14],
    popupAnchor: [0, -16]
  });
}

// Cache icons by status — there are only ~4 distinct variants but ~180
// markers, so building once per status keeps DOM construction cheap.
const PIN_ICON_CACHE = {};
function pinIconFor(statusCls) {
  if (!PIN_ICON_CACHE[statusCls]) PIN_ICON_CACHE[statusCls] = buildPinIcon(statusCls);
  return PIN_ICON_CACHE[statusCls];
}

const markers = {};
mappable.forEach(r => {
  const noteHtml = r.note ? `<div class="popup-note">${escapeHtml(r.note)}</div>` : '';
  const hoursHtml = r.hours ? `<div class="popup-hours">${escapeHtml(r.hours)}</div>` : '';
  const pst = getStatus(r);
  const statusHtml = pst ? `<span class="status-badge status-${pst.cls}">${pst.label}</span>` : '';
  const newHtml = isRecentlyAdded(r) ? '<span class="status-badge status-new">New</span>' : '';

  const popup = `<div class="popup-inner">
    <div class="popup-name">${escapeHtml(r.name)}</div>
    <div class="popup-cuisine">${escapeHtml(r.cuisine)} &middot; ${escapeHtml(r.neighborhood)}</div>
    <div class="popup-address">${escapeHtml(r.address)}</div>
    ${hoursHtml}
    <div class="popup-meta">${newHtml}${statusHtml}${r.source ? `<span>${escapeHtml(r.source)}</span>` : ''}${r.added ? `<span>${formatAdded(r.added)}</span>` : ''}</div>
    ${noteHtml}
    <a class="gmaps-btn" href="${gmapsUrl(r)}" target="_blank" rel="noopener">Open in Google Maps</a>
  </div>`;

  const icon = pinIconFor(pst ? pst.cls : 'default');
  const marker = L.marker([r.displayLat, r.displayLng], { icon })
    .bindPopup(popup, { maxWidth: 280 })
    .addTo(map);
  markers[r.name + r.address] = marker;
});

const neighborhoods = [...new Set(deduped.map(r => r.neighborhood))].sort();
const neighborhoodCounts = {};
deduped.forEach(r => { neighborhoodCounts[r.neighborhood] = (neighborhoodCounts[r.neighborhood] || 0) + 1; });

function createFilterBtn(label, value) {
  const btn = document.createElement('button');
  btn.className = 'filter-btn' + (value === 'all' ? ' active' : '');
  btn.textContent = label;
  btn.dataset.filter = value;
  btn.addEventListener('click', () => {
    filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = value;
    applyFilters();
  });
  filterBar.appendChild(btn);
}

createFilterBtn('All (' + deduped.length + ')', 'all');
// "Recently added" is a special non-area filter — placed next to "All" so it
// reads as a peer view-mode rather than a neighborhood. Hidden when there are
// no entries inside the recency window (e.g. a fresh checkout with no recent
// scout activity) so we don't render a chip that always shows "(0)".
const recentCount = deduped.filter(isRecentlyAdded).length;
if (recentCount > 0) {
  createFilterBtn('🆕 New (' + recentCount + ')', '__recent__');
}
neighborhoods.forEach(n => createFilterBtn(n + ' (' + neighborhoodCounts[n] + ')', n));

const catCounts = {};
deduped.forEach(r => { catCounts[r.cuisineCat] = (catCounts[r.cuisineCat] || 0) + 1; });
const cuisineCategories = Object.keys(catCounts).sort((a, b) => catCounts[b] - catCounts[a]);

// Map of cuisine chip elements keyed by their filter value ('all', 'Italian',
// …). Used by updateCuisineChips() to rewrite labels and hide zero-count
// chips when the active Area filter narrows the underlying scope.
const cuisineChips = {};

function createCuisineBtn(label, value) {
  const btn = document.createElement('button');
  btn.className = 'filter-btn' + (value === 'all' ? ' active' : '');
  btn.textContent = label;
  btn.dataset.filter = value;
  btn.addEventListener('click', () => {
    cuisineFilterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCuisineFilter = value;
    applyFilters();
  });
  cuisineFilterBar.appendChild(btn);
  cuisineChips[value] = btn;
}

createCuisineBtn('All (' + deduped.length + ')', 'all');
cuisineCategories.forEach(cat => createCuisineBtn(cat + ' (' + catCounts[cat] + ')', cat));

// Population the cuisine bar's counts should reflect — i.e. everything the
// active Area filter would currently allow through, without the cuisine
// filter applied. Picking a cuisine narrows further from this scope.
function areaScopedRestaurants() {
  if (activeFilter === 'all') return deduped;
  if (activeFilter === '__recent__') return deduped.filter(isRecentlyAdded);
  return deduped.filter(r => r.neighborhood === activeFilter);
}

// Recompute every cuisine chip's count label and hidden state against the
// area-scoped population, so a user filtering Area=Park Slope no longer sees
// chips like "American (39)" that refer to all of NYC — they see "American
// (4)", and any cuisine with no entries in Park Slope is hidden entirely.
// If the currently-active cuisine chip would be hidden (e.g. they filtered
// Italian first, then picked an area with no Italian), reset to "All" so the
// user isn't stuck on an invisible-but-selected filter. Dispatch a scroll
// event on the bar at the end so the scroll-fade hint recomputes against the
// new visible-chip set.
function updateCuisineChips() {
  const scope = areaScopedRestaurants();
  const localCounts = {};
  scope.forEach(r => { localCounts[r.cuisineCat] = (localCounts[r.cuisineCat] || 0) + 1; });

  Object.entries(cuisineChips).forEach(([value, btn]) => {
    if (value === 'all') {
      btn.textContent = 'All (' + scope.length + ')';
      btn.hidden = false;
      return;
    }
    const count = localCounts[value] || 0;
    btn.textContent = value + ' (' + count + ')';
    btn.hidden = count === 0;
  });

  if (activeCuisineFilter !== 'all' && cuisineChips[activeCuisineFilter]?.hidden) {
    activeCuisineFilter = 'all';
    Object.entries(cuisineChips).forEach(([value, btn]) => {
      btn.classList.toggle('active', value === 'all');
    });
  }

  cuisineFilterBar.dispatchEvent(new Event('scroll'));
}

// Scroll-fade hint wiring. Recomputes a scroll-state class on each of the
// three horizontal scrollable bars so the CSS mask only fades the edges that
// actually have content behind them. Re-runs on scroll, resize, and once
// after initial population — the buttons above are inserted synchronously,
// but we still defer the first computation by a frame so layout has settled
// (fonts, dynamic widths). ResizeObserver covers later width/content changes.
(function wireScrollFadeHints() {
  const SCROLL_BARS = ['#filters', '#cuisine-filters', '#sort-bar']
    .map(sel => document.querySelector(sel))
    .filter(Boolean);

  function updateScrollFade(el) {
    const overflows = el.scrollWidth > el.clientWidth + 1;
    if (!overflows) { el.removeAttribute('data-scroll-state'); return; }
    const atStart = el.scrollLeft <= 1;
    const atEnd = el.scrollLeft + el.clientWidth >= el.scrollWidth - 1;
    el.dataset.scrollState = atStart && atEnd ? '' : atStart ? 'start' : atEnd ? 'end' : 'middle';
  }

  SCROLL_BARS.forEach(el => {
    el.addEventListener('scroll', () => updateScrollFade(el), { passive: true });
  });

  if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(entries => entries.forEach(e => updateScrollFade(e.target)));
    SCROLL_BARS.forEach(el => ro.observe(el));
  }
  window.addEventListener('resize', () => SCROLL_BARS.forEach(updateScrollFade), { passive: true });

  // Defer the first measurement to next frame so the chip layout is settled
  // (font-loaded, computed widths). Without this, scrollWidth can come back
  // slightly small on first paint and we'd mis-classify a barely-overflowing
  // bar as fitting cleanly.
  requestAnimationFrame(() => SCROLL_BARS.forEach(updateScrollFade));
})();

let searchDebounce;
searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => applyFilters(), 200);
  searchClear.classList.toggle('visible', searchInput.value.length > 0);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.classList.remove('visible');
  applyFilters();
  searchInput.focus();
});

clearBtn.addEventListener('click', () => {
  activeFilter = 'all';
  activeCuisineFilter = 'all';
  searchInput.value = '';
  searchClear.classList.remove('visible');
  filterBar.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === 'all');
  });
  cuisineFilterBar.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === 'all');
  });
  applyFilters();
});

document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeSort = btn.dataset.sort;
    applyFilters();
  });
});

function sortList(list) {
  const sorted = list.slice();
  switch (activeSort) {
    case 'alpha':
      sorted.sort((a, b) => a.name.localeCompare(b.name));
      break;
    case 'neighborhood':
      sorted.sort((a, b) => a.neighborhood.localeCompare(b.neighborhood) || a.name.localeCompare(b.name));
      break;
    default:
      sorted.sort((a, b) => addedScore(b.added) - addedScore(a.added));
  }
  return sorted;
}

function renderList(filtered) {
  // Headline reads the current view in plain English. "__recent__" is the
  // special view-mode for entries added inside RECENT_WINDOW_MS — render it
  // as "Recently Added" so it compounds cleanly with cuisine (e.g.
  // "Italian in Recently Added").
  const areaLabel = activeFilter === '__recent__' ? 'Recently Added' : activeFilter;
  let label = 'All Restaurants';
  if (activeFilter !== 'all' && activeCuisineFilter !== 'all') {
    label = activeCuisineFilter + ' in ' + areaLabel;
  } else if (activeFilter !== 'all') {
    label = areaLabel;
  } else if (activeCuisineFilter !== 'all') {
    label = activeCuisineFilter;
  }
  listHeader.textContent = `${label} (${filtered.length})`;
  countEl.textContent = `${deduped.length} spots across NYC`;

  const visibleKeys = new Set(filtered.filter(r => r.lat != null).map(r => r.name + r.address));
  Object.entries(markers).forEach(([key, marker]) => {
    if (visibleKeys.has(key)) { marker.addTo(map); }
    else { marker.remove(); }
  });

  const visibleCoords = filtered.filter(r => r.lat != null && r.lng != null);
  const visibleKey = visibleCoords.map(r => r.name).join('|');
  currentFilteredBounds = visibleCoords.length > 0
    ? L.latLngBounds(visibleCoords.map(r => [r.displayLat ?? r.lat, r.displayLng ?? r.lng]))
    : null;
  if (visibleKey !== prevVisibleKey && !isInitialRender) {
    if (visibleCoords.length === 1) {
      const r0 = visibleCoords[0];
      map.flyTo([r0.displayLat ?? r0.lat, r0.displayLng ?? r0.lng], 16, { duration: 0.6 });
    } else if (visibleCoords.length > 1) {
      map.flyToBounds(currentFilteredBounds, { padding: [30, 30], maxZoom: 16, duration: 0.6 });
    }
  }
  prevVisibleKey = visibleKey;
  isInitialRender = false;
  updateResetButtonVisibility();

  if (filtered.length === 0) {
    listEl.innerHTML = `<div class="empty-state">
      <div class="empty-state-title">No restaurants found</div>
      <div>Try adjusting your search or filters</div>
    </div>`;
    return;
  }

  listEl.innerHTML = filtered.map(r => {
    const st = getStatus(r);
    const stHtml = st ? `<span class="status-badge status-${st.cls}">${st.label}</span>` : '';
    const newHtml = isRecentlyAdded(r) ? '<span class="status-badge status-new">New</span>' : '';
    const hasCoords = r.lat != null && r.lng != null;
    // Mappable cards behave like buttons (Enter / Space → fly to pin).
    // Unmappable cards are static — render as plain divs with no tab stop so
    // keyboard users don't land on a non-interactive element.
    const a11yAttrs = hasCoords
      ? `role="button" tabindex="0" aria-label="${escapeHtml(r.name)}, ${escapeHtml(r.neighborhood)} — show on map"`
      : '';
    return `
    <div class="restaurant-card${hasCoords ? '' : ' card-unmappable'}" data-key="${escapeHtml(r.name)}${escapeHtml(r.address || '')}" ${a11yAttrs}>
      <div class="card-top">
        <div class="card-name">${escapeHtml(r.name)}</div>
      </div>
      <div class="card-details">
        ${newHtml}
        ${stHtml}
        <span class="card-neighborhood">${escapeHtml(r.neighborhood)}</span>
        <span class="card-cuisine">${escapeHtml(r.cuisine)}</span>
      </div>
      <div class="card-details">${r.address ? escapeHtml(r.address) : '<span class="card-address-tbd">Address TBD</span>'}</div>
      ${r.hours ? `<div class="card-hours">${escapeHtml(r.hours)}</div>` : ''}
      ${r.note ? `<div class="card-note">${escapeHtml(r.note)}</div>` : ''}
      <div class="card-bottom">
        <span class="card-source">${r.source ? escapeHtml(r.source) : ''}${r.source && r.added ? ' \u00b7 ' : ''}${r.added ? formatAdded(r.added) : ''}</span>
        ${hasCoords ? `<a class="card-gmaps" href="${gmapsUrl(r)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Google Maps</a>` : ''}
      </div>
    </div>`;
  }).join('');

  listEl.querySelectorAll('.restaurant-card').forEach(card => {
    const activate = () => {
      const key = card.dataset.key;
      const marker = markers[key];
      if (!marker) return;
      map.flyTo(marker.getLatLng(), 16, { duration: 0.8 });
      marker.openPopup();
      // Card activation is the one moment the map intentionally zooms past
      // the natural fitted view, so surface the Reset control here. Every
      // other render path (filter change, search) hides it again.
      resetControl.setHidden(false);
      // On wide layouts the grid shows many cards per row and the map sits
      // at the top of the page — auto-scrolling to top is mildly disruptive
      // but tolerable, and lets the user immediately see the popup. On
      // narrow viewports the user only had a single card in view, so
      // jumping to the map yanks the tapped card off-screen and breaks
      // their place in the list. Keep the scroll position and surface a
      // floating "↑ on map" pill (showMapLinkPill) so the user can opt
      // into seeing the pin.
      if (window.innerWidth >= 768) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        const r = deduped.find(x => (x.name + (x.address || '')) === key);
        showMapLinkPill(r ? r.name : 'Pin');
      }
    };
    card.addEventListener('click', activate);
    // Keyboard activation for role=button cards. Space scrolls by default, so
    // preventDefault() is required to keep it from also paging the list down.
    card.addEventListener('keydown', e => {
      if (card.getAttribute('role') !== 'button') return;
      if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        activate();
      }
    });
  });
}

function updateClearButton() {
  const hasFilters = activeFilter !== 'all' || activeCuisineFilter !== 'all' || searchInput.value.trim() !== '';
  clearBar.classList.toggle('visible', hasFilters);
}

function applyFilters() {
  // Recompute cuisine chip counts and hidden states under the current Area
  // filter first — updateCuisineChips() may reset activeCuisineFilter back to
  // 'all' if the previously-active cuisine no longer has any entries in scope.
  // That has to happen before we read activeCuisineFilter below.
  updateCuisineChips();

  const query = searchInput.value.trim().toLowerCase();
  let filtered;
  if (activeFilter === 'all') {
    filtered = deduped;
  } else if (activeFilter === '__recent__') {
    filtered = deduped.filter(isRecentlyAdded);
  } else {
    filtered = deduped.filter(r => r.neighborhood === activeFilter);
  }
  if (activeCuisineFilter !== 'all') {
    filtered = filtered.filter(r => r.cuisineCat === activeCuisineFilter);
  }
  if (query) {
    filtered = filtered.filter(r =>
      r.name.toLowerCase().includes(query) ||
      (r.cuisine && r.cuisine.toLowerCase().includes(query)) ||
      r.neighborhood.toLowerCase().includes(query) ||
      (r.note && r.note.toLowerCase().includes(query)) ||
      (r.address && r.address.toLowerCase().includes(query))
    );
  }
  renderList(sortList(filtered));
  updateClearButton();
  writeHashState();
}

// URL hash <-> filter state sync. Mirrors {area, cuisine, q, sort} into
// window.location.hash so a filtered view is shareable and bookmarkable. The
// hash is the source of truth on initial load — a deep link like
// "…#area=Park%20Slope&cuisine=Italian&q=pasta" opens directly into that view.
// Defaults are omitted from the URL so an unfiltered view stays a clean "/".
// We use history.replaceState (rather than direct hash assignment) so chip
// clicks don't fill the back-stack with one entry per tweak, and so we don't
// trigger our own hashchange listener on every applyFilters() pass. Browser
// back/forward still navigates between *distinct* shared/loaded states via
// the hashchange handler below.
function readHashState() {
  const h = window.location.hash.replace(/^#/, '');
  if (!h) return null;
  const params = new URLSearchParams(h);
  return {
    area: params.get('area'),
    cuisine: params.get('cuisine'),
    q: params.get('q'),
    sort: params.get('sort'),
  };
}

function writeHashState() {
  const params = new URLSearchParams();
  if (activeFilter !== 'all') params.set('area', activeFilter);
  if (activeCuisineFilter !== 'all') params.set('cuisine', activeCuisineFilter);
  const q = searchInput.value.trim();
  if (q) params.set('q', q);
  if (activeSort !== 'date') params.set('sort', activeSort);
  const next = params.toString();
  const target = next ? '#' + next : '';
  // Only write when the target actually differs from what's already in the
  // bar — avoids spurious history entries and stops feedback loops where a
  // hashchange-driven applyFilters() re-emits the same hash.
  if ((window.location.hash || '') === target) return;
  const url = window.location.pathname + window.location.search + target;
  if (window.history && window.history.replaceState) {
    window.history.replaceState(null, '', url || window.location.pathname);
  } else {
    // Legacy fallback. Direct hash assignment fires hashchange, but our
    // handler is idempotent (re-applying the same state produces the same
    // hash, which short-circuits above) so the loop terminates after one pass.
    window.location.hash = next;
  }
}

// Apply a parsed hash state to the in-memory filter/search/sort variables
// AND to the matching DOM affordances (active chip, search input value).
// Silently ignores values that don't correspond to a real chip — e.g. a
// deleted neighborhood, an old cuisine bucket, or area=__recent__ when the
// recency window is empty (no New chip rendered). Leaves the relevant
// variable at its default in that case so the user lands on the all-data
// view rather than a stuck-on-invisible filter.
function applyHashState(state) {
  if (!state) return;
  if (state.area) {
    const btns = Array.from(filterBar.querySelectorAll('.filter-btn'));
    const btn = btns.find(b => b.dataset.filter === state.area);
    if (btn) {
      btns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = state.area;
    }
  }
  if (state.cuisine) {
    const btns = Array.from(cuisineFilterBar.querySelectorAll('.filter-btn'));
    const btn = btns.find(b => b.dataset.filter === state.cuisine);
    if (btn) {
      btns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCuisineFilter = state.cuisine;
    }
  }
  if (state.q) {
    searchInput.value = state.q;
    searchClear.classList.toggle('visible', state.q.length > 0);
  }
  if (state.sort) {
    const sortBtns = Array.from(document.querySelectorAll('.sort-btn'));
    const sortBtn = sortBtns.find(b => b.dataset.sort === state.sort);
    if (sortBtn) {
      sortBtns.forEach(b => b.classList.remove('active'));
      sortBtn.classList.add('active');
      activeSort = state.sort;
    }
  }
}

window.addEventListener('hashchange', () => {
  applyHashState(readHashState());
  applyFilters();
});

applyHashState(readHashState());
applyFilters();
</script>
</body>
